<!DOCTYPE html>
<html>
<head>
  <!-- Let Flutter inject the correct base path during build -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yassine Elouakfaoui — Portfolio</title>

  <!-- Optional: comment out PWA hints while debugging iOS caching -->
  <!-- <link rel="manifest" href="manifest.json"> -->
  <!-- <meta name="apple-mobile-web-app-capable" content="yes"> -->
  <!-- <meta name="apple-mobile-web-app-status-bar-style" content="black"> -->
  <!-- <meta name="apple-mobile-web-app-title" content="Portfolio"> -->
  <!-- <link rel="apple-touch-icon" href="icons/Icon-192.png"> -->

  <link rel="icon" href="favicon.ico">

  <!-- 0) Kill any old service workers ASAP -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(rs => rs.forEach(r => r.unregister()))
        .catch(()=>{});
    }
  </script>

  <!-- 1) Load the Flutter loader -->
  <script src="flutter.js"></script>
</head>
<body>
<!-- 2) Start Flutter with a mobile-safe fallback -->
<script>
  window.addEventListener('load', function () {
    if (!window._flutter || !_flutter.loader) { console.error('flutter.js not loaded'); return; }

    function boot(options) {
      return new Promise(function (resolve, reject) {
        _flutter.loader.loadEntrypoint({
          serviceWorker: null,
          entrypointUrl: 'main.dart.js?v=6',
          onEntrypointLoaded: function (engineInitializer) {
            engineInitializer.initializeEngine(options)
              .then(function (appRunner) { appRunner.runApp(); resolve(); })
              .catch(reject);
          }
        });
      });
    }

    boot({})
      .catch(function (err) {
        console.warn('Default Flutter web boot failed. Retrying with CanvasKit.', err);
        return boot({ renderer: 'canvaskit' });
      })
      .catch(function (err) {
        console.error('Flutter web failed to start.', err);
        document.body.innerHTML =
          '<div style="padding:16px;font-family:sans-serif;color:#b00020;">' +
          'Failed to start app. Please refresh the page.' +
          '</div>';
      });
  });
</script>
</body>
</html>
