<!DOCTYPE html>
<html>
<head>
  <!-- Let Flutter inject the correct base path during build -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yassine Elouakfaoui — Portfolio</title>

  <!-- Optional: comment out PWA hints while debugging iOS caching -->
  <!-- <link rel="manifest" href="manifest.json"> -->
  <!-- <meta name="apple-mobile-web-app-capable" content="yes"> -->
  <!-- <meta name="apple-mobile-web-app-status-bar-style" content="black"> -->
  <!-- <meta name="apple-mobile-web-app-title" content="Portfolio"> -->
  <!-- <link rel="apple-touch-icon" href="icons/Icon-192.png"> -->

  <link rel="icon" href="favicon.ico">

  <!-- 0) Kill any old service workers ASAP -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(rs => rs.forEach(r => r.unregister()))
        .catch(()=>{});
    }
  </script>

  <!-- 1) Load the Flutter loader -->
  <script src="flutter.js"></script>
</head>
<body>
<!-- 2) Start Flutter with: no SW, HTML renderer, and cache-busted entrypoint -->
<script>
  window.addEventListener('load', function () {
    if (!window._flutter || !_flutter.loader) { console.error('flutter.js not loaded'); return; }
    _flutter.loader.loadEntrypoint({
      serviceWorker: null,                 // hard-disable SW registration
      entrypointUrl: 'main.dart.js?v=4',   // bust stale caches on mobile
      onEntrypointLoaded: function (engineInitializer) {
        engineInitializer.initializeEngine({ renderer: 'html' })
          .then(appRunner => appRunner.runApp());
      }
    });
  });
</script>
</body>
</html>
