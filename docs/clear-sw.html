<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clear SW</title>
<pre id="log">Clearing…</pre>
<script>
    (async () => {
      const log = (m) => (document.getElementById('log').textContent += '\n' + m);
      try {
        if ('serviceWorker' in navigator) {
          const reg = await navigator.serviceWorker.getRegistration('/portfolio/');
          if (reg) { await reg.unregister(); log('Unregistered SW for /portfolio/'); }
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const r of regs) { try { await r.unregister(); } catch(_){} }
          log('Unregistered any other SWs');
          // hard cache clear
          if ('caches' in window) {
            const keys = await caches.keys();
            for (const k of keys) { try { await caches.delete(k); } catch(_){} }
            log('Cleared CacheStorage');
          }
        } else {
          log('No SW support');
        }
      } catch (e) { log('Error: ' + e); }
      setTimeout(()=>location.replace('/portfolio/?t=' + Date.now()), 600);
    })();
</script>
