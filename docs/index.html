<!DOCTYPE html>
<html>
<head>
  <!-- Let Flutter inject the correct base path during build -->
  <base href="/portfolio/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yassine Elouakfaoui — Portfolio</title>

  <!-- Optional: comment out PWA hints while debugging iOS caching -->
  <!-- <link rel="manifest" href="manifest.json"> -->
  <!-- <meta name="apple-mobile-web-app-capable" content="yes"> -->
  <!-- <meta name="apple-mobile-web-app-status-bar-style" content="black"> -->
  <!-- <meta name="apple-mobile-web-app-title" content="Portfolio"> -->
  <!-- <link rel="apple-touch-icon" href="icons/Icon-192.png"> -->

  <link rel="icon" href="favicon.ico">

  <!-- 0) Kill any old service workers ASAP -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(rs => rs.forEach(r => r.unregister()))
        .catch(()=>{});
    }
  </script>

  <!-- 1) Load the Flutter loader -->
  <script src="flutter.js"></script>
</head>
<body>
<!-- 2) Start Flutter with robust error reporting -->
<script>
  (function () {
    function showBootError(message) {
      document.body.innerHTML =
        '<pre style="white-space:pre-wrap;padding:16px;font-family:monospace;color:#b00020;">' +
        message +
        '</pre>';
    }

    window.addEventListener('error', function (e) {
      showBootError('Startup error: ' + (e.message || 'unknown'));
    });

    window.addEventListener('unhandledrejection', function (e) {
      showBootError('Startup promise error: ' + (e.reason || 'unknown'));
    });

    window.addEventListener('load', function () {
      if (!window._flutter || !_flutter.loader) {
        showBootError('flutter.js not loaded');
        return;
      }

      _flutter.loader
        .loadEntrypoint({
          serviceWorker: null,
          entrypointUrl: 'main.dart.js?v=7'
        })
        .then(function (engineInitializer) {
          return engineInitializer.initializeEngine();
        })
        .then(function (appRunner) {
          return appRunner.runApp();
        })
        .catch(function (err) {
          showBootError('Flutter start failed: ' + err);
        });
    });
  })();
</script>
</body>
</html>
