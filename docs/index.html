<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1">  <!-- IMPORTANT on iOS -->

  <title>portfolio</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="portfolio">

  <script>const serviceWorkerVersion = null;</script>
  <script src="flutter.js" defer></script>
</head>
<body>
<script>
  // show any JS error on-screen (helps on phones)
  (function(){
    function show(msg){
      var p = document.createElement('pre');
      p.style.cssText = 'position:fixed;left:0;top:0;right:0;padding:10px;background:#111;color:#ff6b6b;z-index:999999;white-space:pre-wrap;font-family:monospace';
      p.textContent = msg;
      document.body.appendChild(p);
    }
    window.addEventListener('error', e => show('JS Error: ' + e.message));
    window.addEventListener('unhandledrejection', e => show('Promise: ' + e.reason));
  })();

  window.addEventListener('load', function() {
    _flutter.loader.loadEntrypoint({
      serviceWorker: { serviceWorkerVersion },
      onEntrypointLoaded: function(engineInitializer) {
        engineInitializer.initializeEngine().then(function(appRunner) {
          appRunner.runApp();
        });
      }
    });
  });
</script>
</body>
</html>
