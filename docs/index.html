<!DOCTYPE html>
<html>
<head>
  <!-- Flutter replaces /portfolio/ at build time (--base-href flag) -->
  <base href="/portfolio/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Yassine Elouakfaoui portfolio - mobile developer and SOC analyst.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Yassine Portfolio">
  <meta name="theme-color" content="#0B0D13">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" href="favicon.ico">

  <title>Yassine Elouakfaoui - Portfolio</title>

  <style>
    html, body {
      width: 100%;
      max-width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background-color: #0b0d13;
    }
    body {
      position: relative;
      overscroll-behavior-y: none;
      overscroll-behavior-x: none;
      -webkit-text-size-adjust: 100%;
      touch-action: pan-y;
    }
    flt-glass-pane,
    flt-scene-host {
      max-width: 100vw !important;
      overflow-x: clip !important;
    }
  </style>

  <!-- Kill any stale service workers so old caches never block a deploy -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(function(rs) { rs.forEach(function(r) { r.unregister(); }); })
        .catch(function() {});
    }
  </script>

  <script src="flutter.js" defer></script>
</head>
<body>
<script>
  (function () {
    function showBootError(message) {
      document.body.innerHTML =
        '<pre style="white-space:pre-wrap;padding:16px;font-family:monospace;color:#b00020;">' +
        message + '</pre>';
    }

    window.addEventListener('error', function (e) {
      showBootError('Startup error: ' + (e.message || 'unknown'));
    });

    window.addEventListener('unhandledrejection', function (e) {
      showBootError('Startup promise error: ' + (e.reason || 'unknown'));
    });

    window.addEventListener('load', function () {
      if (!window._flutter || !_flutter.loader) {
        showBootError('flutter.js not loaded');
        return;
      }

      _flutter.loader
        .loadEntrypoint({
          serviceWorker: null,
          onEntrypointLoaded: function (engineInitializer) {
            engineInitializer
              .initializeEngine()
              .then(function (appRunner) {
                appRunner.runApp();
              });
          }
        })
        .catch(function (err) {
          showBootError('Flutter start failed: ' + err);
        });
    });
  })();
</script>
</body>
</html>
