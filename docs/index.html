<!DOCTYPE html>
<html>
<head>
  <!-- Flutter uses this line to inject the correct base path -->
  <base href="/portfolio/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yassine Elouakfaoui — Portfolio</title>

  <!-- Meta description for SEO & link previews -->
  <meta name="description" content="Mobile Developer & SOC Analyst — Kotlin & Flutter projects, SOC detections & incident response.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Yassine Elouakfaoui — Portfolio">
  <meta property="og:description" content="Mobile Developer (Kotlin/Flutter) | SOC Analyst (Detection, Response, Security).">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:url" content="https://elouakfaouiyassine.github.io/portfolio/">

  <link rel="icon" href="favicon.ico">
  <link rel="manifest" href="manifest.json">

  <!-- iOS compatibility -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <script>const serviceWorkerVersion = null;</script>

  <style>
    html, body { height: 100%; margin: 0; background:#0B0D13; }
    #flt-glass-pane, .flt-glass-pane, canvas { position: fixed; inset: 0; background:#0B0D13 !important; }
  </style>
  <!-- Load flutter.js immediately so it’s ready for the app -->
  <script src="flutter.js"></script>
</head>

<body>
<script>
  // Start the Flutter app
  window.addEventListener('load', function () {
    if (!window._flutter || !_flutter.loader) {
      console.error('flutter.js not loaded');
      return;
    }

    _flutter.loader.loadEntrypoint({
      serviceWorker: { serviceWorkerVersion },
      onEntrypointLoaded: function (engineInitializer) {
        engineInitializer.initializeEngine().then(function (appRunner) {
          appRunner.runApp();
        });
      }
    });
  });
</script>
</body>
</html>
