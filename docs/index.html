<!DOCTYPE html>
<html>
<head>
  <base href="/portfolio/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yassine — Portfolio (Mobile Debug)</title>

  <script>
    // Visible markers
    document.addEventListener('DOMContentLoaded', function() {
      var mark = document.createElement('div');
      mark.id = 'marker';
      mark.style.cssText = 'font:14px/1.4 monospace;padding:8px;color:#0f0;background:#111';
      mark.textContent = 'Stage A: DOMContentLoaded';
      document.body.appendChild(mark);
    });

    // Error overlay
    (function () {
      function show(msg){
        var p = document.createElement('pre');
        p.style.cssText = 'position:fixed;left:0;top:0;right:0;padding:10px;background:#111;color:#ff6b6b;z-index:999999;font-family:monospace;white-space:pre-wrap';
        p.textContent = msg;
        document.body.appendChild(p);
      }
      window.addEventListener('error', e => show('JS Error: ' + e.message + '\n' + (e.error && e.error.stack || 'no stack')));
      window.addEventListener('unhandledrejection', e => show('Promise rejection: ' + (e.reason && e.reason.stack || e.reason)));
    })();

    // Service worker off
    const serviceWorkerVersion = null;
  </script>

  <!-- Load flutter.js synchronously -->
  <script src="flutter.js"></script>
</head>
<body>
<script>
  // Marker: flutter.js tag executed
  (function stepB(){
    var m = document.getElementById('marker') || (function(){var d=document.createElement('div');d.id='marker';d.style.cssText='font:14px/1.4 monospace;padding:8px;color:#0f0;background:#111';document.body.appendChild(d);return d})();
    m.textContent = 'Stage B: flutter.js tag executed';
  })();

  // Start Flutter
  window.addEventListener('load', function () {
    var m = document.getElementById('marker');
    m.textContent = 'Stage C: window.load fired';

    if (!window._flutter || !_flutter.loader) {
      m.textContent = 'Stage D: flutter.js NOT loaded (window._flutter missing)';
      return;
    } else {
      m.textContent = 'Stage D: flutter.js present. Starting loadEntrypoint...';
    }

    _flutter.loader.loadEntrypoint({
      serviceWorker: { serviceWorkerVersion },
      onEntrypointLoaded: function (engineInitializer) {
        m.textContent = 'Stage E: engineInitializer OK. Initializing engine...';
        engineInitializer.initializeEngine().then(function (appRunner) {
          m.textContent = 'Stage F: engine initialized. Running app...';
          appRunner.runApp();
          m.textContent = 'Stage G: appRunner.runApp() called ✅';
        }).catch(function(err){
          m.textContent = 'Stage E error: ' + (err && (err.stack || err.message) || err);
        });
      }
    }).catch(function (err){
      m.textContent = 'Stage D error: ' + (err && (err.stack || err.message) || err);
    });
  });
</script>
</body>
</html>
